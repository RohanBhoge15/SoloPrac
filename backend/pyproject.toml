[project]
name = "soloprac-backend"
version = "0.1.0"
description = "SoloPrac AI - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "qdrant-client==1.12.0",
    "redis>=5.0.0",
    "arq>=0.23.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "httpx-oauth>=0.4.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "playwright>=1.40.0",
    "pyecharts>=2.0.0",
    "cryptography>=42.0.0",
    "sse-starlette>=2.1.0",
    "python-magic>=0.4.27",
    "pypdf2>=3.0.1",
    "qrcode[pil]>=8.0",
    "reportlab>=4.0.0",
    "sentence-transformers>=2.3.0",
    "torch>=2.4.0",
    "boto3>=1.34.0",
    # Langfuse SDK v2: code uses the v2 tracing API (create_span, score(trace_id=...))
    # and docker-compose pins the langfuse server to 2.40.0. Do NOT bump to 3.x/4.x
    # without migrating app/services/langfuse.py to the new SDK.
    "langfuse>=2.40.0,<3.0.0",
    "geoalchemy2>=0.14.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true