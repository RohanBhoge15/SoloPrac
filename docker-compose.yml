version: '3.8'

services:
  # PostgreSQL with PostGIS for geospatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: soloprac-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soloprac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-soloprac}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soloprac} -d ${POSTGRES_DB:-soloprac}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: soloprac-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Redis for caching, queues, and rate limiting
  redis:
    image: redis:7-alpine
    container_name: soloprac-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-soloprac_redis_dev_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-soloprac_redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Langfuse - Observability & Tracing
  langfuse:
    image: langfuse/langfuse:2.40.0
    container_name: soloprac-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soloprac}:${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-changeme_generate_strong_secret}
      NEXTAUTH_URL: http://localhost:3000
      SALT: ${LANGFUSE_SALT:-changeme_generate_strong_salt}
      LOG_LEVEL: info
    volumes:
      - langfuse_data:/data
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - soloprac-network

  # MinIO - Object Storage (S3-compatible, replaces local filesystem)
  minio:
    image: minio/minio:latest
    container_name: soloprac-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soloprac-backend
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soloprac}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soloprac}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANGFUSE_HOST=http://langfuse:3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_generate_strong_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # MinIO S3 storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-soloprac}
      # Persist HuggingFace model downloads (MedCPT, BGE-M3, BiomedCLIP, etc.)
      # so they are downloaded once and reused across rebuilds/restarts.
      - HF_HOME=/hf_cache
    volumes:
      - ./backend:/app
      - hf_cache:/hf_cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soloprac-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Arq Background Worker
  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soloprac-arq-worker
    command: ["python", "worker.py"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soloprac}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soloprac}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANGFUSE_HOST=http://langfuse:3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_generate_strong_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Share the same HuggingFace cache as the backend (see backend service).
      - HF_HOME=/hf_cache
    volumes:
      - ./backend:/app
      - hf_cache:/hf_cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - soloprac-network

  # Caddy Reverse Proxy (Production)
  caddy:
    image: caddy:2.8-alpine
    container_name: soloprac-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - soloprac-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  langfuse_data:
  caddy_data:
  caddy_config:
  hf_cache:
  minio_data:

networks:
  soloprac-network:
    driver: bridge