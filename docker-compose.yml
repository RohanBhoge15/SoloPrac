version: '3.8'

services:
  # PostgreSQL with PostGIS for geospatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: soloprac-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soloprac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-soloprac}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soloprac} -d ${POSTGRES_DB:-soloprac}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: soloprac-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Redis for caching, queues, and rate limiting
  redis:
    image: redis:7-alpine
    container_name: soloprac-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-soloprac_redis_dev_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-soloprac_redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Langfuse - Observability & Tracing
  langfuse:
    image: langfuse/langfuse:2.40.0
    container_name: soloprac-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soloprac}:${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-changeme_generate_strong_secret}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-changeme_generate_strong_salt}
      HOSTNAME: 0.0.0.0
      LOG_LEVEL: info
    volumes:
      - langfuse_data:/data
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - soloprac-network

  # MinIO - Object Storage (S3-compatible, replaces local filesystem)
  minio:
    image: minio/minio:latest
    container_name: soloprac-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soloprac-backend
    # --reload: auto-restart on code changes (backend/ is bind-mounted).
    # Only in the dev compose override — the Dockerfile CMD stays reload-free.
    # NOTE: --reload is incompatible with --workers>1 (uvicorn hard-fails). We
    # keep --reload for dev DX; production Dockerfile CMD uses --workers 4
    # --loop uvloop --http httptools for real concurrency.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--loop", "uvloop", "--http", "httptools"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soloprac}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soloprac}
      # Runtime role — RLS-enforced (must match app/migrations/rls_setup.sql).
      - APP_DB_USER=${APP_DB_USER:-soloprac_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-soloprac_app_dev_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-soloprac_redis_dev_password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_generate_strong_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - MAVERICK_MODEL=${MAVERICK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - MAVERICK_STRUCTURED_OUTPUT=${MAVERICK_STRUCTURED_OUTPUT:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # MinIO S3 storage
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-soloprac}
      # Persist HuggingFace model downloads (MedCPT, BGE-M3, BiomedCLIP, etc.)
      # so they are downloaded once and reused across rebuilds/restarts.
      - HF_HOME=/hf_cache
      - HF_TOKEN=${HF_TOKEN:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./backend:/app
      # Scripts folder — utility scripts (embed_openi.py, download_openi.py,
      # traffic sim) mounted read-only so we can iterate without docker cp.
      - ./scripts:/scripts:ro
      # HF cache on host — survives container rebuilds AND is inspectable
      # from Windows. Same folder shared by backend and arq-worker to
      # avoid the model-per-container duplication that used to eat ~5 GB.
      - D:\models\hf-cache:/hf_cache
      - D:\models:/models
    # ── GPU passthrough (RTX 3050 Laptop, 4 GB VRAM) ──
    # Requires NVIDIA Container Toolkit (already installed — `docker info`
    # shows the `nvidia` runtime). Without this block the container gets no
    # /dev/nvidia*, torch.cuda.is_available() returns False, and embeddings
    # silently run on CPU. 4 GB VRAM is enough for MedCPT + BiomedCLIP + BGE-M3
    # in fp16; MedGemma OCR runs in its own container (llama-server below).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request; exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soloprac-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # VITE_API_URL removed — frontend/src/services/api.ts hardcodes "/api/v1"
      # and never reads import.meta.env.VITE_API_URL. The Vite dev proxy uses
      # VITE_PROXY_TARGET, which is the one that actually matters.
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # llama.cpp server hosting MedGemma-4B GGUF (Q4_K_M + mmproj) for VLM image OCR
  llama-server:
    # CUDA-enabled build so we can partial-offload MedGemma to the RTX 3050.
    # With 4 GB VRAM shared with the embedding stack, we offload 15 layers
    # (~1.4 GB), which is enough to get a 2-3× token/sec bump without OOM.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: soloprac-llama-server
    command:
      - "--model"
      - "/models/medgemma-gguf/medgemma-4b-it_Q4_K_M.gguf"
      - "--mmproj"
      - "/models/medgemma-gguf/mmproj-medgemma-4b-it-F16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "4096"
      - "--n-gpu-layers"
      - "15"
    mem_limit: 5g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - D:\models:/models
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - soloprac-network

  # Arq Background Worker
  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soloprac-arq-worker
    command: ["arq", "app.services.email_queue.WorkerSettings", "--watch", "/app"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-soloprac}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-soloprac_dev_password_change_me}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-soloprac}
      # Runtime role — RLS-enforced (must match app/migrations/rls_setup.sql).
      - APP_DB_USER=${APP_DB_USER:-soloprac_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-soloprac_app_dev_password_change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-soloprac_redis_dev_password}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme_generate_strong_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - MAVERICK_MODEL=${MAVERICK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - MAVERICK_STRUCTURED_OUTPUT=${MAVERICK_STRUCTURED_OUTPUT:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # MinIO — parse_document_job / generate_weekly_report_job / compare_images_job
      # download from S3 and upload PDFs. Without these the worker falls back to
      # config's `localhost:9000` default (the container itself) and every async
      # OCR/PDF job fails with "Could not connect to the endpoint URL".
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-soloprac}
      # Share the same HuggingFace cache as the backend (see backend service).
      - HF_HOME=/hf_cache
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./backend:/app
      # Share the same host HF cache as the backend — one copy on D:, not two.
      - D:\models\hf-cache:/hf_cache
      - D:\models:/models
    # ── GPU passthrough — arq-worker runs the heavy embed / index jobs
    # (P1.9 index_version_job, the Open-i batch embed). Same 4 GB card
    # shared with the backend, but only one process pushes tensors at a
    # time in practice.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    # Worker has no HTTP port and the image has no curl/ps/wget — so check the
    # arq process itself via /proc/1/cmdline instead of the Dockerfile's
    # curl-based HEALTHCHECK (which always failed: "curl: not found").
    healthcheck:
      test: ["CMD-SHELL", "grep -qa arq /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - soloprac-network

  # Caddy Reverse Proxy (Production)
  caddy:
    image: caddy:2.8-alpine
    container_name: soloprac-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - soloprac-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  langfuse_data:
  caddy_data:
  caddy_config:
  # hf_cache: removed — HF downloads now bind-mounted to D:\models\hf-cache
  # (see backend + arq-worker volumes) so they survive rebuilds and don't
  # duplicate across containers.
  minio_data:

networks:
  soloprac-network:
    driver: bridge
